name: release

# Releases are driven by the VERSION file (or a manual dispatch), not by tag
# pushes: the workflow mints the tag itself at HEAD, so the tag and the released
# commit can never disagree, and no contributor needs tag-push rights.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      tag:
        description: "Semver tag to create at HEAD and release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and mint tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$DISPATCH_TAG" ]; then TAG="$DISPATCH_TAG"; else TAG="$(tr -d '[:space:]' < VERSION)"; fi
          case "$TAG" in v[0-9]*) ;; *) echo "invalid tag: $TAG"; exit 1;; esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: dist/checksums.txt
